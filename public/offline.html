<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors ligne · Cissé Multi-Service</title>
    <meta name="theme-color" content="#1B2A5E" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        background-color: #1B2A5E;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .container {
        max-width: 440px;
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 36px 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge {
        display: inline-block;
        background: rgba(224, 160, 48, 0.15);
        color: #E0A030;
        border: 1px solid rgba(224, 160, 48, 0.3);
        border-radius: 9999px;
        padding: 4px 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 10px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn-reload {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 44px;
        background: linear-gradient(135deg, #E0A030, #c8901f);
        color: #0E1530;
        border: none;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn-reload:hover {
        opacity: 0.95;
        transform: translateY(-1px);
      }
      .btn-reload:active {
        transform: scale(0.98);
      }
      .btn-whatsapp {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 44px;
        background: #128C7E;
        color: #ffffff;
        border: none;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .btn-whatsapp:hover {
        background: #0d6e63;
        transform: translateY(-1px);
      }
      .btn-whatsapp:active {
        transform: scale(0.98);
      }
      .btn-whatsapp svg {
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">

          <path d="M82.29 39.93 A30 30 0 1 0 82.29 80.07" fill="none" stroke="#E0A030" stroke-width="15" stroke-linecap="round"/>
          <path d="M60 50 L70 60 L60 70 L50 60 Z" fill="#F5F6FA"/>

    </div>
  </body>
</html>
